name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate skills, references, evals, and packs
        run: ./scripts/validate-skills.sh
      - name: Build skill zips and packs (must succeed)
        run: ./scripts/build-packs.sh
